name: lsrebuild
on:
  push:
    paths:
      - 'lsrebuild/**'
      - '.github/workflows/lsrebuild.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build sweet-lsrebuild (iOS arm64, ad-hoc signed with entitlements)
        run: |
          set -e
          cd lsrebuild
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -isysroot "$SDK" -arch arm64 -miphoneos-version-min=16.0 \
            -fobjc-arc -Wall -Wno-unused-function -framework Foundation -framework MobileCoreServices \
            sweet-lsrebuild.m -o sweet-lsrebuild
          xcrun --sdk iphoneos clang -isysroot "$SDK" -arch arm64 -miphoneos-version-min=16.0 -fobjc-arc -Os -Wall -Wno-unused-function -framework Foundation -framework MobileCoreServices sweet-regplugins.m -o sweet-regplugins
          strip -x sweet-regplugins || true
          (brew install ldid >/dev/null 2>&1 && ldid -Sent.plist sweet-regplugins) || codesign -f -s - --entitlements ent.plist sweet-regplugins
          xcrun --sdk iphoneos clang -isysroot "$SDK" -arch arm64 -miphoneos-version-min=16.0 -fobjc-arc -Os -Wall -Wno-unused-function -framework Foundation -framework MobileCoreServices sweet-lsrebuild2.m -o sweet-lsrebuild2
          strip -x sweet-lsrebuild2 || true
          (command -v ldid >/dev/null 2>&1 && ldid -Sent.plist sweet-lsrebuild2) || codesign -f -s - --entitlements ent.plist sweet-lsrebuild2
          xcrun --sdk iphoneos clang -isysroot "$SDK" -arch arm64 -miphoneos-version-min=16.0 -fobjc-arc -Os -Wall -Wno-unused-function -framework Foundation sweet-mcmdiag.m -o sweet-mcmdiag
          strip -x sweet-mcmdiag || true
          (command -v ldid >/dev/null 2>&1 && ldid -Sent_lsd.plist sweet-mcmdiag) || codesign -f -s - --entitlements ent_lsd.plist sweet-mcmdiag
          ls -l sweet-lsrebuild sweet-regplugins sweet-lsrebuild2 sweet-mcmdiag
          codesign -f -s - --entitlements ent.plist sweet-lsrebuild
          file sweet-lsrebuild
          codesign -d --entitlements - sweet-lsrebuild | head -40 || true
          shasum -a 256 sweet-lsrebuild
      - uses: actions/upload-artifact@v4
        with:
          name: sweet-lsrebuild
          path: |
            lsrebuild/sweet-lsrebuild
            lsrebuild/sweet-regplugins
            lsrebuild/sweet-lsrebuild2
            lsrebuild/sweet-mcmdiag
